# Minimal path configuration:
# - base_dir must point to the root of the git repository (where this Snakefile lives)
# - data.preprocessed_dir and data.data_path_table_processed point to your preprocessed inputs
paths:
  base_dir: /path/to/git/repo
  experiments_dir: /path/to/experiments/dir
  data:
    preprocessed_dir: /path/to/preprocessed/data
    data_path_table_processed: /path/to/data_path_table.csv

# parameters to setup the experiment
experiment:
  global_time_window_width: 1152
  experiment_name: "Experiment_name"
  plot_figures: "True"
  selected_features:
    - "all"
  cohort_assignment:
    training:
      - nose_orientation:
          - "nose0_withRC"
        proton_energy:
          - 187
          - 139
          - 162
        mu:
          - 0.9
          - 0.2
          - 0.8
        range_shift_type:
          - "grs"
        detector:
          - 99
        repetition:
          - 1
          - 2
    validation:
      - nose_orientation:
          - "G270_withRC"
        proton_energy:
          - 159
        mu:
          - 0.1
        range_shift_type:
          - "grs"
          - "lrs"
        detector:
          - 99
        repetition:
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          - 7
          - 8
    testing:
      - nose_orientation:
          - "G210_withRC"
        proton_energy:
          - 158
        mu:
          - 0.2
        range_shift_type:
          - "grs"
          - "lrs"
        detector:
          - 99
        repetition:
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          - 7
          - 8
  model_development:
    reference: -1
    feature_selection_methods:
      - "lasso_gaussian"
      - "pearson"
      - "mrmr"
      - "multivariate_regression"
    model_learners:
      - "iterative_linear"
    args:
      feature_calculation:
        global_time_window:
          - 750 # ca. 3.5ns
          - 1728 # ca. 7.9 ns
      feature_clustering:
        cluster_representatives:
          - "all"
        cluster_distance_threshold: 0.2
        cluster_representative_method: "best_predictor"
      feature_selection:
        max_features: 10
      feature_normalization:
        n_refs: 8




